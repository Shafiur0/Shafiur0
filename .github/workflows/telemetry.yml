name: Telemetry plate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/gen_telemetry.py"
      - "build/ds.py"
      - "build/type_engine.py"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install --quiet fonttools

      - name: Render telemetry plate from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/gen_telemetry.py --login ${{ github.repository_owner }}

      - name: Commit refreshed plate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ds/telemetry.svg
          git diff --staged --quiet || git commit -m "chore: refresh telemetry plate"
          git push
