<svg xmlns="http://www.w3.org/2000/svg" width="460" height="190" viewBox="0 0 460 190" fill="none">
  <defs>
    <linearGradient id="borderGrad1" x1="0" y1="0" x2="460" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bf00ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="460" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d19"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="cubeTop1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00c8e0"/>
    </linearGradient>
    <linearGradient id="cubeLeft1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0088aa"/>
      <stop offset="100%" stop-color="#004466"/>
    </linearGradient>
    <linearGradient id="cubeRight1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b4cc"/>
      <stop offset="100%" stop-color="#006688"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="457" height="187" rx="14" fill="url(#bgGrad1)" stroke="url(#borderGrad1)" stroke-width="1.5"/>
  
  <!-- Cyber HUD Decorative Corner Grids -->
  <path d="M 14 6 L 6 6 L 6 14" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 446 6 L 454 6 L 454 14" stroke="#00ff9d" stroke-width="2" fill="none"/>
  <path d="M 6 176 L 6 184 L 14 184" stroke="#bf00ff" stroke-width="2" fill="none"/>
  <path d="M 454 176 L 454 184 L 446 184" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- 3D Isometric Cube Icon -->
  <g transform="translate(26, 24)">
    <ellipse cx="18" cy="34" rx="16" ry="6" fill="#00f0ff" opacity="0.25" filter="url(#glow1)"/>
    <polygon points="18,4 34,13 18,22 2,13" fill="url(#cubeTop1)" stroke="#ffffff" stroke-width="0.5"/>
    <polygon points="2,13 18,22 18,36 2,27" fill="url(#cubeLeft1)"/>
    <polygon points="18,22 34,13 34,27 18,36" fill="url(#cubeRight1)"/>
    <circle cx="18" cy="20" r="2.5" fill="#ffffff" opacity="0.9" filter="url(#glow1)"/>
  </g>

  <!-- Title -->
  <text x="72" y="42" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">🌾 bd-krishibid</text>
  
  <!-- Award Badge (Top Right) -->
  <rect x="306" y="22" width="130" height="22" rx="11" fill="#00ff9d" fill-opacity="0.12" stroke="#00ff9d" stroke-width="1"/>
  <text x="371" y="37" fill="#00ff9d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">🏅 SUMMIT FINALIST</text>

  <!-- Description -->
  <text x="26" y="78" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    AI-driven AgriTech intelligence engine with deep learning crop
  </text>
  <text x="26" y="98" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    pathology diagnosis, predictive yields, and live commodity feeds.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(26, 118)">
    <rect x="0" y="0" width="56" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="28" y="14" fill="#61dafb" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">React</text>

    <rect x="64" y="0" width="62" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="95" y="14" fill="#68a063" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Node.js</text>

    <rect x="134" y="0" width="60" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="164" y="14" fill="#ffd343" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Python</text>

    <rect x="202" y="0" width="68" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="236" y="14" fill="#00ff9d" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">OpenCV</text>

    <rect x="278" y="0" width="74" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="315" y="14" fill="#47a248" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">MongoDB</text>
  </g>

  <!-- Bottom Bar: Status & Link Hint -->
  <line x1="26" y1="154" x2="434" y2="154" stroke="#1f293d" stroke-width="1"/>
  <circle cx="34" cy="170" r="4" fill="#00ff9d"/>
  <text x="45" y="174" fill="#94a3b8" font-family="monospace" font-size="11">3D SCANNER ACTIVE • ★ 3 STARS</text>
  <text x="434" y="174" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">VIEW 3D CORE →</text>
</svg>